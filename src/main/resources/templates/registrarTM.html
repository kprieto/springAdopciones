<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registro de Tipo Mascota</title>
    <link rel="stylesheet" th:href="@{/css/input.css}">
    <link rel="stylesheet"th:href="@{/css/output.css}" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

</head>
<body>  
    <div class="container mx-auto px-4">
        <h1 class="text-fuchsia-600 text-2xl" th:text="${#strings.isEmpty(tipoMascota.id) ? 'Crear Nuevo Tipo Mascota' : 'Editar Tipo Mascota'}"></h1>

        <form th:action="@{${tipoMascota.id != null} ? '/tipoMascotas/actualizar/' + ${tipoMascota.id} : '/tipoMascotas/registrar'}" th:object="${tipoMascota}"  method="post" enctype="multipart/form-data" class="space-y-6 w-full max-w-lg">
            <input type="hidden" th:if="${!#strings.isEmpty(tipoMascota.id)}" th:value="${tipoMascota.id}" />
            <div class="flex flex-wrap -mx-3 mb-6">
                <div class="w-full md:w-1/2 px-3 mb-6 md:mb-0">
                    <label for="nombre" class="block uppercase text-sm font-bold text-gray-700 mb-2">Nombre: </label>
                    <input type="text" id="nombre" name="nombre" th:field="*{nombre}" required
                        class="mt-1 block w-full py-3 px-4 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" oninput="this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1);">
                </div>    
            </div>
            <div th:if="${error}" class="bg-red-100 text-red-700 p-2 rounded mb-4 font-bold">
                <p th:text="${error}"></p>
            </div>
            <div class="flex flex-wrap -mx-3 mb-6 justify-center">
                <button type="submit"
                        class="px-4 py-2 bg-blue-500 hover:bg-blue-700 text-white font-bold rounded " th:text="${tipoMascota.id != null ? 'Actualizar Tipo Mascota' : 'Registrar Tipo Mascota'}">
                    
                </button>
            </div>
        </form>
        <div class="flex justify-end">
            <a th:href="@{/tipoMascotas}"
                    class="px-4 py-2 bg-green-500 hover:bg-green-700 text-white font-bold rounded " > Tipo Mascotas
            </a>
        </div>
    </div>  
    

    

</body>
</html>
