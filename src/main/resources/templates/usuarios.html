<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Usuarios</title>
    <meta name="viewport" http-equiv="Content-Type" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/botones.css}">
    <link rel="stylesheet"th:href="@{/css/output.css}" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
    <body>
        <div class="container mx-auto px-4">
            <h2 class="text-fuchsia-600 text-2xl">Usuarios Registrados</h2>
            <br></br>
            <a a th:href="@{/usuarios/new}" class="btn px-3 py-2 bg-blue-500 hover:bg-blue-700 text-white font-bold rounded" style="width: 25%">+ Nueva Usuario</a>
            <br></br>
            <div th:if="${mensaje}" id="mensaje-exito" class="mensaje bg-green-100 text-green-700 p-2 rounded mb-4 font-bold ">
                <p  th:text="${mensaje}"></p>
            </div>
            <table class="min-w-full table-auto border border-fuchsia-600 border-separate border-spacing-2">
                <thead class="uppercase bg-[#e541c4] text-[#e5e7eb]" style="background-color: #e541c4; color: #e5e7eb;">
                    <tr>
                        <th class="border border-fuchsia-600 px-4 py-2">ID</th>
                        <th class="border border-fuchsia-600 px-4 py-2">Nombre</th>
                        <th class="border border-fuchsia-600 px-4 py-2">Apellido Paterno</th>
                        <th class="border border-fuchsia-600 px-4 py-2">Apellido Materno</th>
                        <th class="border border-fuchsia-600 px-4 py-2">Edad</th>
                        <th class="border border-fuchsia-600 px-4 py-2">Email</th>
                        <th class="border border-fuchsia-600 px-4 py-2">Teléfono</th>
                        <th class="border border-fuchsia-600 px-4 py-2">Dirección</th>
                        <th class="border border-fuchsia-600 px-4 py-2">Acciones</th>

                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario : ${usuarios}" class="hover:bg-gray-50">
                        <td class="border border-fuchsia-600 px-4 py-2" th:text="${usuario.id}"></td>
                        <td class="border border-fuchsia-600 px-4 py-2" th:text="${usuario.nombre}"></td>
                        <td class="border border-fuchsia-600 px-4 py-2" th:text="${usuario.apellidoPaterno}"></td>
                        <td class="border border-fuchsia-600 px-4 py-2" th:text="${usuario.apellidoMaterno}"></td>
                        <td class="border border-fuchsia-600 px-4 py-2" th:text="${usuario.edad}"></td>
                        <td class="border border-fuchsia-600 px-4 py-2" th:text="${usuario.correoElectronico}"></td>
                        <td class="border border-fuchsia-600 px-4 py-2" th:text="${usuario.telefono}"></td>
                        <td class="border border-fuchsia-600 px-4 py-2" th:text="${usuario.direccion}"></td>

                        <td class="border border-fuchsia-600 px-4 py-2 flex items-center">
                            <a class="mr-2" th:href="@{/usuarios/editar/{id}(id=${usuario.id})}" ><img class="w-20 h-20 object-contain" th:src="@{/images/Editar.png}" alt="Editar Usuario"></a>
                            <a class="ml-2" th:href="@{/usuarios/eliminar/{id}(id=${usuario.id})}" onclick="return confirm('¿Estás seguro de que deseas eliminar el usuario?')"><img class=" w-20 h-20 object-contain" th:src="@{/images/Eliminar.png}" alt="Eliminar Usuario"></a>
                        </td>

                    </tr>
                </tbody>
            </table>
            <div class="flex justify-end pt-6">
                <a th:href="@{/home}"
                        class="px-4 py-2 bg-green-500 hover:bg-green-700 text-white font-bold rounded " > Home
                </a>
            </div>
            
        </div>
        
    </body>
    <script>
        // Esconde el mensaje de éxito después de 3 segundos
        setTimeout(() => {
            const mensajeExito = document.getElementById("mensaje-exito");
            if (mensajeExito) {
                mensajeExito.style.display = "none";
            }

        }, 3000); // 3000 milisegundos = 3 segundos
    </script>
</html>
