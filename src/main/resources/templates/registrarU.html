<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registro de Usuarios</title>
    <link rel="stylesheet"th:href="@{/css/output.css}" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mx-auto px-4">
        <h1 class="text-fuchsia-600 text-2xl" th:text="${#strings.isEmpty(usuario.id) ? 'Crear Nuevo Usuario' : 'Editar Usuario'}"></h1>
        <form th:action="@{${usuario.id != null} ? '/usuarios/actualizar/' + ${usuario.id} : '/usuarios/registrar'}" th:object="${usuario}"  method="post"  enctype="multipart/form-data" class="space-y-6">
            <input type="hidden" th:if="${!#strings.isEmpty(usuario.id)}" th:value="${usuario.id}" />
                <!-- Nombre -->
                <div class="flex flex-wrap -mx-3 mb-6">
                    <label for="nombre" class="block uppercase text-sm font-bold text-gray-700 mb-2">Nombre: </label>
                    <input type="text" id="nombre" name="nombre" th:field="*{nombre}" required
                        class="mt-1 block w-full py-3 px-4 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" oninput="this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1);">
                </div>

                <!-- Apellido Paterno -->
                <div class="flex flex-wrap -mx-3 mb-6">
                    <label for="apellidoPaterno" class="block uppercase text-sm font-bold text-gray-700 mb-2">Apellido Paterno: </label>
                    <input type="text" id="apellidoPaterno" name="apellidoPaterno" th:field="*{apellidoPaterno}" required
                        class="mt-1 block w-full py-3 px-4 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" oninput="this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1);">
                </div>

                <!-- Apellido Materno -->
                <div class="flex flex-wrap -mx-3 mb-6">
                    <label for="apellidoMaterno" class="block uppercase text-sm font-bold text-gray-700 mb-2">Apellido Materno: </label>
                    <input type="text" id="apellidoMaterno" name="apellidoMaterno" th:field="*{apellidoMaterno}" required
                        class="mt-1 block w-full py-3 px-4 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" oninput="this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1);">
                </div>

                <!-- Edad -->
                <div class="flex flex-wrap -mx-3 mb-6">
                    <label for="edad" class="block uppercase text-sm font-bold text-gray-700 mb-2">Edad: </label>
                    <input type="number" id="edad" name="edad" th:field="*{edad}" required
                        class="mt-1 block w-full py-3 px-4 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" >
                </div>

                <!-- Email -->
                <div class="flex flex-wrap -mx-3 mb-6">
                    <label for="correoElectronico" class="block uppercase text-sm font-bold text-gray-700 mb-2">Email: </label>
                    <input type="email" id="correoElectronico" name="correoElectronico" th:field="*{correoElectronico}" required
                        class="mt-1 block w-full py-3 px-4 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" >
                </div>

                <!-- Teléfono -->
                <div class="flex flex-wrap -mx-3 mb-6">
                    <label for="telefono" class="block uppercase text-sm font-bold text-gray-700 mb-2">Teléfono: </label>
                    <input type="text" id="telefono" name="telefono" th:field="*{telefono}" required
                        class="mt-1 block w-full py-3 px-4 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" >
                </div>
        
                <!-- Dirección -->
                <div class="flex flex-wrap -mx-3 mb-6">
                    <label for="direccion" class="block uppercase text-sm font-bold text-gray-700 mb-2">Dirección: </label>
                    <input type="text" id="direccion" name="direccion" th:field="*{direccion}" required
                        class="mt-1 block w-full py-3 px-4 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" oninput="this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1);">
                </div>

                <br></br>
                <div th:if="${error}" class="bg-red-100 text-red-700 p-2 rounded mb-4 font-bold">
                    <p th:text="${error}"></p>
                </div>
                <!-- Botón de Enviar -->
                <div class="flex justify-center">
                    <button type="submit"
                            class="px-4 py-2 bg-blue-500 hover:bg-blue-700 text-white font-bold rounded " th:text="${usuario.id != null ? 'Actualizar Usuario' : 'Registrar Usuario'}">
                    </button>
                </div>
        </form>
        <div class="flex justify-end">
            <a th:href="@{/usuarios}"
                    class="px-4 py-2 bg-green-500 hover:bg-green-700 text-white font-bold rounded " > Usuarios
            </a>
        </div>
    </div>
    

</body>
</html>
